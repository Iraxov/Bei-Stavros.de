# Netlify: Die Seite ist fertig, es ist kein Build-Befehl nötig.
[build]
  publish = "."

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# Bilder: 30 Tage zwischenspeichern
[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Indexsperre, solange die Seite nicht live ist (vor dem Livegang diesen Block löschen)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Unbekannte Adressen: zurück zur Startseite (ersetzt die frühere 404-Seite)
[[redirects]]
  from = "/*"
  to = "/"
  status = 404
